aid: kyverna-therapeutics
name: Kyverna Therapeutics
description: 'Kyverna Therapeutics (Nasdaq: KYTX) is a patient-centered, clinical-stage
  biopharmaceutical company headquartered in Emeryville, California, developing engineered
  T cell therapies for patients suffering from autoimmune diseases. Kyverna adapts CD19
  CAR T-cell therapy — originally developed for B cell cancers — to deeply deplete the
  B cells that drive autoimmunity, with the goal of durable, drug-free remission. Its
  lead candidate, mivocabtagene autoleucel (miv-cel, KYV-101), is a fully human CD19
  CAR T-cell therapy in Phase 2 development for stiff person syndrome, myasthenia gravis
  and multiple sclerosis, and in Phase 1/2 development for systemic sclerosis and lupus
  nephritis in the United States and Germany. The pipeline also includes next-generation
  autologous and allogeneic CAR T constructs, including KYV-201, built on the company''s
  Ingenui-T rapid manufacturing platform. Kyverna is a biopharmaceutical operating company
  and publishes no public developer API, SDK, or developer portal; this profile tracks
  its public web, corporate and investor surface within the API Evangelist network.'
